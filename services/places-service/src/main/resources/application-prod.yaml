spring:
  config:
    import: optional:configserver:http://10.10.146.230:8888
  application:
    name: places-service
  datasource:
    url: jdbc:postgresql://10.10.146.230:5432/places_repo
    username: places_repo
    password: places-repo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        default_schema: places_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  flyway:
    locations: classpath:db/migration
    schemas: places_schema
    baseline-on-migrate: true
eureka:
  instance:
    lease-renewal-interval-in-seconds: 30
    hostname: places-service
    appname: places-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    healthcheck:
      enabled: true


