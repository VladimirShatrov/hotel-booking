openapi: 3.0.3
info:
  title: API Аутентификации
  version: 1.0.0
  description: API для управления аутентификацией и пользователями

components:
  schemas:
    ErrorResponse:
      type: object
      description: Стандартный ответ с ошибкой
      properties:
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
          example: "2024-01-15T10:30:00Z"
        status:
          type: integer
          description: HTTP статус код
          example: 400
        error:
          type: string
          description: Описание ошибки
          example: "Неверный формат email"
        path:
          type: string
          description: Путь запроса
          example: "/api/v1/auth/register"

    SignInRequest:
      type: object
      description: Запрос на вход в систему
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          example: "user@example.com"
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: "securePassword123"

    SignUpRequest:
      type: object
      description: Запрос на регистрацию пользователя
      required:
        - email
        - password
        - confirmPassword
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          example: "user@example.com"
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: "securePassword123"
        confirmPassword:
          type: string
          format: password
          description: Подтверждение пароля
          example: "securePassword123"

    AuthResponse:
      type: object
      description: Ответ с токенами аутентификации
      properties:
        accessToken:
          type: string
          description: Access token для авторизации
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Refresh token для обновления access token
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    RefreshTokenRequest:
      type: object
      description: Запрос на обновление токена
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    ChangePasswordRequest:
      type: object
      description: Запрос на изменение пароля
      required:
        - oldPassword
        - newPassword
        - confirmPassword
      properties:
        oldPassword:
          type: string
          format: password
          description: Текущий пароль
          example: "oldPassword123"
        newPassword:
          type: string
          format: password
          description: Новый пароль
          example: "newSecurePassword456"
        confirmPassword:
          type: string
          format: password
          description: Подтверждение пароля
          example: "newSecurePassword456"

  responses:
    BadRequestError:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            passwordMismatch:
              summary: Пароли не совпадают
              value:
                timestamp: "2024-01-15T10:31:00Z"
                status: 400
                error: "Пароли не совпадают"
                path: "/api/v1/auth/register"

    NotFoundError:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              summary: Пользователь не найден
              value:
                timestamp: "2024-01-15T10:32:00Z"
                status: 404
                error: "Пользователь не найден"
                path: "/api/v1/auth/login"

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              summary: Внутренняя ошибка сервера
              value:
                timestamp: "2024-01-15T10:33:00Z"
                status: 500
                error: "Внутренняя ошибка сервера"
                path: "/api/v1/auth/login"

    LockedError:
      description: Аккаунт заблокирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountLocked:
              summary: Аккаунт заблокирован
              value:
                timestamp: "2024-01-15T10:34:00Z"
                status: 423
                error: "Аккаунт заблокирован"
                path: "/api/v1/auth/login"

    ForbiddenError:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accessDenied:
              summary: Недостаточно прав
              value:
                timestamp: "2024-01-15T10:35:00Z"
                status: 403
                error: "Недостаточно прав для выполнения операции"
                path: "/api/v1/auth/user/user@example.com/give/admin"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен аутентификации

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Аутентификация
      summary: Вход пользователя в систему
      description: Аутентификация пользователя по email и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '423':
          $ref: '#/components/responses/LockedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      tags:
        - Аутентификация
      summary: Выход пользователя из системы
      description: Завершение сессии пользователя
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Имя пользователя
      responses:
        '200':
          description: Успешный выход
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/register:
    post:
      tags:
        - Аутентификация
      summary: Регистрация нового пользователя
      description: Создание нового аккаунта пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь успешно создан
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Аутентификация
      summary: Обновление access token
      description: Получение нового access token по refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токен успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /.well-known/jwks.json:
    get:
      tags:
        - JWKS
      summary: Получение набора JSON Web Keys
      description: Возвращает публичные ключи для проверки JWT токенов
      responses:
        '200':
          description: JWKS успешно получен
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    description: Массив JSON Web Keys
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          description: Тип ключа
                          example: "RSA"
                        kid:
                          type: string
                          description: Идентификатор ключа
                          example: "main-key"
                        n:
                          type: string
                          description: Модуль RSA ключа
                        e:
                          type: string
                          description: Публичная экспонента RSA ключа
                        alg:
                          type: string
                          description: Алгоритм
                          example: "RS256"
                        use:
                          type: string
                          description: Использование ключа
                          example: "sig"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/user/me/password/change:
    post:
      tags:
        - Управление пользователями
      summary: Изменение пароля пользователя
      description: Смена пароля для текущего аутентифицированного пользователя
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-Email
          in: header
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
            example: "user@example.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль успешно изменен
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/user/me/deactivate:
    post:
      tags:
        - Управление пользователями
      summary: Деактивация аккаунта пользователя
      description: Деактивация собственного аккаунта
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-Email
          in: header
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
            example: "user@example.com"
      responses:
        '200':
          description: Аккаунт успешно деактивирован
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/user/me/reactivate:
    post:
      tags:
        - Управление пользователями
      summary: Реактивация аккаунта пользователя
      description: Повторная активация ранее деактивированного аккаунта
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-Email
          in: header
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
            example: "user@example.com"
      responses:
        '200':
          description: Аккаунт успешно реактивирован
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/user/admin/{userEmail}/give/admin:
    post:
      tags:
        - Управление пользователями
      summary: Назначение прав администратора
      description: Предоставление прав администратора указанному пользователю (только для администраторов)
      security:
        - BearerAuth: []
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email пользователя для назначения прав администратора
          schema:
            type: string
            format: email
            example: "user@example.com"
      responses:
        '200':
          description: Права администратора успешно предоставлены
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'