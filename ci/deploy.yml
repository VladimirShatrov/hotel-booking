.docker-deploy:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client docker-cli sshpass curl jq
  variables:
    CI_REGISTRY_USER: "gitlab-ci-token"
    CI_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"
  script:
    - |
      echo "Registry: ${CI_REGISTRY}"
      echo "Image: ${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"

      sshpass -p "${SSH_PASSWORD}" ssh \
        -o StrictHostKeyChecking=no \
        -o LogLevel=ERROR \
        ${SSH_SERVER} /bin/sh <<END_SSH
      set -ex

      export CI_REGISTRY_USER="${CI_REGISTRY_USER}"
      export CI_REGISTRY_PASSWORD="${CI_REGISTRY_PASSWORD}"
      export CI_REGISTRY="${CI_REGISTRY}"
      export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE}"
      export CI_COMMIT_SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
      export SERVICE_NAME="${SERVICE_NAME}"
      export SERVICE_PORT="${SERVICE_PORT}"
      export ENV_VARS="${ENV_VARS}"

      echo "Authenticating to registry..."
      if ! echo "${CI_REGISTRY_PASSWORD}" | sudo docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"; then
        echo "ERROR: Docker login failed"
        exit 1
      fi

      if ! sudo docker network inspect app-network >/dev/null 2>&1; then
        echo "Creating network..."
        sudo docker network create app-network || {
          echo "ERROR: Failed to create network"
          exit 1
        }
      fi

      echo "Pulling image..."
      if ! sudo docker pull "${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"; then
        echo "ERROR: Failed to pull image"
        exit 1
      fi

      sudo docker pull "${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      sudo docker run -d \
        --name "${SERVICE_NAME}" \
        --network app-network \
        -p "${SERVICE_PORT}:\${SERVICE_PORT}" \
        ${ENV_VARS} \
        "${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      
      sudo docker ps -a | grep "${SERVICE_NAME}"
      exit 0
      END_SSH

clean-backend-docker:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client docker-cli sshpass curl jq
  script:
    - |
      sshpass -p "${SSH_PASSWORD}" ssh \
        -o StrictHostKeyChecking=no \
        -o LogLevel=ERROR \
        ${SSH_SERVER} /bin/sh <<END_SSH
      set -ex

      export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE}"

      sudo docker ps -a --format "{{.ID}} {{.Image}}" | grep "${CI_REGISTRY_IMAGE}" | awk '{print $1}' | xargs -r docker stop || true
      sudo docker ps -a --format "{{.ID}} {{.Image}}" | grep "${CI_REGISTRY_IMAGE}" | awk '{print $1}' | xargs -r docker rm || true

      sudo docker images --format "{{.Repository}}:{{.Tag}}" | grep "^${CI_REGISTRY_IMAGE}" | xargs -r docker rmi -f || true

      exit 0
      END_SSH

dockerdeploy-config-server:
  extends: .docker-deploy
  needs: ["clean-backend-docker"]
  variables:
    SERVICE_NAME: "config-server"
    SERVICE_PORT: 8888
    ENV_VARS: >-
      -e SPRING_PROFILES_ACTIVE=git
      -e SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/portner-boop/kon-repo-proj

dockerdeploy-discovery-service:
  extends: .docker-deploy
  needs: ["dockerdeploy-config-server"]
  variables:
    SERVICE_NAME: "discovery-service"
    SERVICE_PORT: 8761
    ENV_VARS: >-
      -e SPRING_PROFILES_ACTIVE=prod
      -e EUREKA_HOSTNAME=discovery-service
      -e SERVER_PORT=8761
      -e SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888

