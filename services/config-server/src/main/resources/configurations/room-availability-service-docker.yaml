eureka:
  instance:
    lease-renewal-interval-in-seconds: 30
    hostname: user-service
    appname: user-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    healthcheck:
      enabled: true
server:
  port: 8007

spring:
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        default_schema: availability_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://postgres-availability:5432/availability_db
    username: availability_service
    password: availability_pass
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: room-availability-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: org.relax.shared.dto
flyway:
  locations: classpath:db/migration
  schemas: availability_schema
  baseline-on-migrate: true