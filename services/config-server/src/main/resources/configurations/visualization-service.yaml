spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/places?schema=visualization_schema
    username: user
    password: user
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: true
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        default_schema: visualization_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: bob
