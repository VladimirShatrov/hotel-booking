.docker-deploy:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache sshpass docker-cli
  script:
    - sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SSH_SERVER} "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker stop ${SERVICE_NAME} || true &&
        docker rm ${SERVICE_NAME} || true &&
        docker pull ${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA} &&
        docker run -d --name ${SERVICE_NAME} -p ${SERVICE_PORT}:${SERVICE_PORT} ${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}
      "

dockerdeploy-config-server:
  extends: .docker-deploy
  variables:
    SERVICE_NAME: "config-server"
    SERVICE_PORT: 8888

dockerdeploy-discovery-service:
  extends: .docker-deploy
  variables:
    SERVICE_NAME: "discovery-service"
    SERVICE_PORT: 8761

dockerdeploy-order-service:
  extends: .docker-deploy
  variables:
    SERVICE_NAME: "order-service"
    SERVICE_PORT: 8887

dockerdeploy-places-service:
  extends: .docker-deploy
  variables:
    SERVICE_NAME: "places-service"
    SERVICE_PORT: 8080
