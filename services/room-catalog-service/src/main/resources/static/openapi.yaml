openapi: 3.0.1
info:
  title: Room Catalog Service API
  description: API для управления комнатами (Room Catalog Service)
  version: 1.0.0

paths:
  /api/v1/room/{roomId}:
    get:
      summary: Получить данные комнаты по ID
      operationId: getRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/vnd.t1internship.room.v1+json:
              schema:
                $ref: '#/components/schemas/RoomData'
        '404':
          description: Комната не найдена

    put:
      summary: Обновить данные комнаты
      operationId: updateRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Комната обновлена
          content:
            application/vnd.t1internship.room.v1+json:
              schema:
                $ref: '#/components/schemas/RoomData'
        '404':
          description: Комната не найдена

  /api/v1/room/{roomId}/exists:
    get:
      summary: Проверить, существует ли комната
      operationId: existsRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Комната существует
        '404':
          description: Комната не найдена

components:
  schemas:
    RoomData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b7b8b84c-7b5c-4df4-8d31-cb7c620894d5"
        name:
          type: string
          example: "Conference Room A"
        capacity:
          type: integer
          example: 20
        location:
          type: string
          example: "2nd floor"

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          example: "New Room Name"
        capacity:
          type: integer
          example: 25
        location:
          type: string
          example: "3rd floor"
