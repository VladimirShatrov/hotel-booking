spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          httpclient:
            connect-timeout: 1000
            pool:
              max-idle-time: 5s
            response-timeout: 5s
          metrics:
            enabled: true
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/user/**, /api/v1/department/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin
                - name: JwtUserEmailHeaderFilter

server:
  port: 8010
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    lease-expiration-duration-in-seconds: 30
    lease-renewal-interval-in-seconds: 10
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway, mappings
    jmx:
      exposure:
        include: '*'
