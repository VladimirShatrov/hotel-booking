spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/places?schema=order_schema
    username: user
    password: user
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        default_schema: order_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
flyway:
  locations: classpath:db/migration
  schemas: order_schema
  baseline-on-migrate: true
server:
  port: 8004