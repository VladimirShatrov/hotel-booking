.docker-build:
  stage: dockerize
  image: docker:latest
  variables:
    CI_REGISTRY_USER: "gitlab-ci-token"
    CI_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"
  services:
    - docker:dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - cd ${CI_PROJECT_DIR}
    - docker build -t ${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA} -f ${DOCKERFILE_PATH} ${BUILD_CONTEXT_PATH}
    - docker push ${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}

dockerbuild-config-server:
  extends: .docker-build
  variables:
    SERVICE_NAME: "config-server"
    BUILD_CONTEXT_PATH: services/config-server
    DOCKERFILE_PATH: services/config-server/Dockerfile

